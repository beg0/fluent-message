[package]
name = "fluent-message"
description = "Derive Fluent message ids and arguments from Rust enums"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fluent-bundle = "0.16"

# The proc-macro half of the crate. Optional so that `default-features = false`
# users can implement `FluentMessage` by hand.
fluent-message-derive = { version = "0.1.0", path = "../fluent-message-derive", optional = true }

# Optional integrations. None of them are needed for the derive itself.
fluent-templates = { version = "0.13", optional = true }
unic-langid = { version = "0.9", optional = true }

[features]
default = ["derive"]
derive = ["dep:fluent-message-derive"]
# `Loader` integration (fluent-templates).
templates = ["dep:fluent-templates", "dep:unic-langid"]

[dev-dependencies]
unic-langid = { version = "0.9", features = ["macros"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
